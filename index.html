<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bank transaction categoriser | Ryan Ward</title>
    <meta
      name="description"
      content="A model that learns spending categories from bank transaction descriptions, with an honest evaluation. Runs entirely in your browser."
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@stlite/browser@1.11.0/build/stlite.css"
    />
    <style>
      .back {
        font-family: system-ui, sans-serif;
        font-size: 0.9rem;
        padding: 0.75rem 1rem;
      }
      .back a {
        color: inherit;
      }
      #loading {
        font-family: system-ui, sans-serif;
        text-align: center;
        padding: 3rem 1rem;
      }
    </style>
  </head>
  <body>
    <div class="back">
      <a href="https://ryanward.dev/projects/">&larr; All projects</a> &middot;
      <a href="https://github.com/ryanward-io/bank-transaction-categoriser">Code</a>
    </div>
    <div id="root">
      <p id="loading">
        Starting Python in your browser&hellip; this takes 10&ndash;30 seconds the first time.
      </p>
    </div>
    <noscript>This demo needs JavaScript, because it runs Python in your browser.</noscript>
    <script type="module">
      import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@1.11.0/build/stlite.js";

      mount(
        {
          entrypoint: "streamlit_app.py",
          requirements: ["scikit-learn", "altair", "pandas"],
          streamlitConfig: { "client.toolbarMode": "viewer" },
          files: {
            "streamlit_app.py": { url: "./streamlit_app.py" },
            "data/transactions.csv": { url: "./data/transactions.csv" },
          },
        },
        document.getElementById("root"),
      );
    </script>
  </body>
</html>
